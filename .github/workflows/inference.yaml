name: Full MLOps Pipeline

on:
  push:
    branches:
      - inference_branch

jobs:

  test-model:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create Config Directory for Tests
      run: mkdir -p config

    - name: Run Pytest Suite
      run: pytest tests/

  train-model:
    runs-on: ubuntu-latest
    needs: test-model
    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Training Script
      run: python src/train.py

    - name: Upload Trained Model Artifact
      uses: actions/upload-artifact@v4
      with:
        name: trained-model
        path: models/model_train.pkl
        retention-days: 1

  inference-model:
    runs-on: ubuntu-latest
    needs: train-model
    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Download Trained Model Artifact
      uses: actions/download-artifact@v4
      with:
        name: trained-model
        path: trained-model/
  
    - name: Run Inference Script
      run: python src/inference.py